services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mpa
      POSTGRES_USER: mpa
      POSTGRES_PASSWORD: mpa_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpa -d mpa"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      DATABASE_URL: postgresql://mpa:mpa_dev@db:5432/mpa
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
